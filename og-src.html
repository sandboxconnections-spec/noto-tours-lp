<!doctype html><html><head><meta charset="utf-8">
<!-- 共有画像 img/og-notokuru.jpg（1200×630）の元。作り直すときは _make_og の手順＝ヘッドレスChromeでこのページを撮る -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Shippori+Mincho+B1:wght@400&display=swap" rel="stylesheet">
<style>*{margin:0}body{width:1200px;height:630px;position:relative;overflow:hidden;background:#000;font-family:"Cormorant Garamond",serif;color:#fff}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 55%}
.mk{display:block;width:120px;height:120px;margin-top:30px}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.15) 60%,rgba(0,0,0,0))}
.t{position:absolute;left:80px;top:50%;transform:translateY(-50%)}
.v{font:400 18px/1 "Shippori Mincho B1",serif;letter-spacing:.5em;opacity:.85}
p{margin-top:26px;font:300 22px/1 "Cormorant Garamond";letter-spacing:.28em;text-transform:uppercase;opacity:.9}</style></head>
<body><img class="bg" src="img/hero-bay-sunset.jpg"><div class="sh"></div><div class="t"><div class="v">能登七尾</div><img class="mk" src="img/notokuru-mark.png" alt="のとくる？"><p>Private journeys in Nanao</p></div></body></html>
